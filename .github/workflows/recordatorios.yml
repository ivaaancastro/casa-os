name: Recordatorios

on:
  schedule:
    # Vercel Hobby no permite cron sub-diario; GitHub Actions sí.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: recordatorios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al dispatch de producción
        env:
          CASA_OS_URL: ${{ vars.CASA_OS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CASA_OS_URL" ]; then
            echo "Falta la variable de repositorio CASA_OS_URL" >&2
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secreto de repositorio CRON_SECRET" >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 30 \
            -X POST "${CASA_OS_URL%/}/api/reminders/dispatch" \
            -H "Authorization: Bearer ${CRON_SECRET}"
